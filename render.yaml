services:
  - type: web
    name: industra-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Set to your frontend URL after you deploy it, e.g. https://industra-ai.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
